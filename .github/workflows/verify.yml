name: Verify customer skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Bootstrap a fresh customer workspace
        run: python cbn-daily-orders/scripts/cbn.py --workspace "customer 工作目录" init
      - name: Verify complete workflow and edge cases
        run: python cbn-daily-orders/scripts/cbn.py --workspace "customer 工作目录" self-test
      - name: Verify initialization is repeatable
        run: python cbn-daily-orders/scripts/cbn.py --workspace "customer 工作目录" init
